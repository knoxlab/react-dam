contentType: digital_asset
description: >
  前台多条件筛选使用交付查询拉回已发布条目后在页面内过滤。
  全库检索依赖管理索引；下列字段在模型上已标记 filterable 或 publicIndex。
query:
  endpoint: /api/v1/delivery/sites/{siteId}/contents/query
  params:
    contentType: digital_asset
    limit: 50
    orderBy: updatedAt
    status: PUBLISHED
filters:
  - field: asset_kind_s
    label: 资源类型
  - field: license_s
    label: 许可协议
  - field: tags_ss
    label: 人工标签
    note: 进入访客全文索引。TAG 不能作为筛选字段，前台在已加载结果里过滤。
  - field: ai_tags_ss
    label: AI 标签
    note: 与人工标签分开索引。
sort:
  - updatedAt
  - title
  - file_size_i
  - asset_kind_s
