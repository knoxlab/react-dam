code: digital_asset
name: 数字资源
description: 图片、音视频、文档与其他资源的统一目录。二进制文件由站点自动预置的 media_* 模型存储，本模型保存可检索的元数据。
# 客户端表单控制器（FR-CM-FORMCTRL-001）：脚本随模板工程一起分发（template/scripts/...），
# 导入后内容编辑器自动加载 —— 选媒体后补齐目录字段，并按许可协议/资源类型做条件显示。
formController: /scripts/digital-asset-form-controller.js
fields:
  - code: asset_code_s
    name: 资源编码
    fieldType: STRING
    required: true
    groupName: 标识
    uniqueField: true
    adminIndex: true
    publicIndex: true
    filterable: true
  - code: asset_kind_s
    name: 资源类型
    fieldType: ENUM
    required: true
    groupName: 标识
    adminIndex: true
    publicIndex: true
    filterable: true
    sortable: true
    fieldConfig:
      options:
        - value: image
          label: 图片
        - value: video
          label: 视频
        - value: audio
          label: 音频
        - value: document
          label: 文档
        - value: other
          label: 其他
  - code: summary_t
    name: 摘要
    fieldType: LONG_TEXT
    required: true
    groupName: 描述
    publicIndex: true
    highlight: true
  - code: body_t
    name: 正文
    fieldType: LONG_TEXT
    groupName: 描述
    helpText: 文本类内容把正文直接放在这里；其他类型可写说明。
  - code: mime_type_s
    name: MIME 类型
    fieldType: STRING
    groupName: 文件
    filterable: true
  - code: file_size_i
    name: 文件大小
    fieldType: INTEGER
    groupName: 文件
    sortable: true
    helpText: 单位为字节。
  - code: thumbnail_url_s
    name: 预览图
    fieldType: IMAGE
    groupName: 文件
    helpText: 资源列表卡片预览图层读取此字段（IMAGE：存媒体资产编号，编辑时可本地重新上传/更换）。未显式上传时，上传登记会自动从 Knox-Media 同步预览资产（图片缩略/视频海报截帧/文档封面）；留空时前台按资源类型回退图标。
  # 媒体引用采用重复组：一个资源可关联多个媒体（图片/视频/音频/文档等）。
  # 预览、全屏查看与详情页「媒体列表」页签按行切换；每行字段码带 media_ 前缀，
  # 与上方顶层兼容字段（storage_uri_s 等，历史单媒体数据与会员上传仍写这里）不撞码。
  - code: media_items
    name: 关联媒体
    fieldType: REPEAT_GROUP
    groupName: 文件
    helpText: 逐行添加该资源关联的媒体；预览与全屏查看时可切换，详情页「媒体列表」页签可点击跳转（仅一个媒体时该页签不显示）。
    fieldConfig:
      minItems: 0
      maxItems: 50
    fields:
      - code: media_storage_uri_s
        name: 媒体原件
        fieldType: MEDIA_REF
        helpText: 指向 media_* 内容或对象存储键，不在前台直接暴露无鉴权原件。
        fieldConfig:
          allowedKinds:
            - image
            - video
            - audio
            - document
          allowedContentTypes:
            - media_image
            - media_video
            - media_audio
            - media_document
      - code: media_title_s
        name: 媒体标题
        fieldType: STRING
        helpText: 列表与切换条上的显示名，留空时前台回退资源标题/文件名。
      - code: media_kind_s
        name: 媒体类型
        fieldType: ENUM
        fieldConfig:
          options:
            - value: image
              label: 图片
            - value: video
              label: 视频
            - value: audio
              label: 音频
            - value: document
              label: 文档
            - value: other
              label: 其他
      - code: media_mime_type_s
        name: MIME 类型
        fieldType: STRING
      - code: media_file_size_i
        name: 文件大小
        fieldType: INTEGER
        helpText: 单位为字节。
      - code: media_thumbnail_url_s
        name: 媒体预览图
        fieldType: IMAGE
        helpText: 媒体预览图（IMAGE：存媒体资产编号）；留空时按媒体类型从原件回退。
  - code: tags_ss
    name: 人工标签
    fieldType: TAG
    groupName: 分类
    publicIndex: true
  - code: ai_tags_ss
    name: AI 标签
    fieldType: TAG
    groupName: 分类
    publicIndex: true
    helpText: 由管理端 POST /api/v1/ai/suggest/tags 生成后写入，与人工标签分开保存。
  - code: copyright_owner_s
    name: 版权方
    fieldType: STRING
    groupName: 版权
    filterable: true
    adminIndex: true
  - code: license_s
    name: 许可协议
    fieldType: ENUM
    groupName: 版权
    filterable: true
    fieldConfig:
      options:
        - value: all-rights
          label: 保留所有权利
        - value: internal
          label: 内部使用
        - value: cc-by
          label: CC BY
        - value: cc-by-sa
          label: CC BY-SA
        - value: public-domain
          label: 公有领域
  - code: copyright_until_dt
    name: 版权到期
    fieldType: DATE_TIME
    groupName: 版权
# 设计画布布局：两个页签 —— 1. 关联媒体；2. 资源编目（导入时生成 TAB 结构，导出时往返保真）。
# title_s 为系统字段（标题），可直接在页签里引用，置于「资源编目」首位。
# 所属部门/资源组/当前版本/审批状态/下载链接有效期已退役（2026-10-23）：不再进表单。
layout:
  tabs:
    - title: 关联媒体
      fields:
        - media_items
    - title: 资源编目
      fields:
        - title_s
        - asset_code_s
        - asset_kind_s
        - summary_t
        - body_t
        - mime_type_s
        - file_size_i
        - thumbnail_url_s
        - tags_ss
        - ai_tags_ss
        - copyright_owner_s
        - license_s
        - copyright_until_dt
