code: asset-approval
name: 数字资源审批
description: >
  数字资源审批流（2026-10-23 起审批状态由工作流承载，不再写回 approval_status_s 字段）。
  站点包导入不会自动创建工作流，请在管理端按本定义配置。
states:
  - code: draft
    name: 草稿
  - code: pending
    name: 待审批
  - code: approved
    name: 已通过
  - code: rejected
    name: 已驳回
transitions:
  - from: draft
    to: pending
    action: 提交审批
    roles: [editor]
  - from: pending
    to: approved
    action: 通过
    roles: [approver]
  - from: pending
    to: rejected
    action: 驳回
    roles: [approver]
  - from: rejected
    to: draft
    action: 退回修改
    roles: [editor]
